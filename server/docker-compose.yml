services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - torch_cache:/root/.cache
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - vrm_models:/usr/share/nginx/html/3d-assests/vrm-models
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  torch_cache:
  vrm_models:
