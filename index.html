<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Animation Viewer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.js",
      "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --panel: rgba(10, 10, 18, 0.82);
      --border: rgba(80, 200, 255, 0.18);
      --accent: #38d9f5;
      --accent2: #a855f7;
      --text: #c8dde8;
      --muted: #4a6070;
      --active-bg: rgba(56, 217, 245, 0.14);
      --active-border: rgba(56, 217, 245, 0.7);
      --btn-hover: rgba(56, 217, 245, 0.08);
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Barlow', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    #canvas-container {
      position: fixed; inset: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Drop overlay ─────────────────────────────────── */
    #drop-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      background: rgba(10, 10, 18, 0.88);
      backdrop-filter: blur(6px);
      z-index: 50;
      transition: opacity 0.4s ease;
    }
    #drop-overlay.hidden { opacity: 0; pointer-events: none; }

    .drop-ring {
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      animation: spin-ring 8s linear infinite;
    }
    .drop-ring::before {
      content: '';
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      animation: spin-ring 3s linear infinite reverse;
    }
    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .drop-icon {
      font-size: 48px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .drop-title {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .drop-sub {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    #file-input-btn {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--border);
      padding: 9px 20px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #file-input-btn:hover {
      border-color: var(--accent);
      background: var(--btn-hover);
    }
    #file-hidden { display: none; }

    /* drag-active pulse */
    body.drag-active #drop-overlay {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    body.drag-active .drop-ring { border-color: var(--accent); }

    /* ── Left panel ───────────────────────────────────── */
    #side-panel {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(14px);
      display: flex; flex-direction: column;
      z-index: 20;
      transform: translateX(0);
      transition: transform 0.3s ease;
    }
    #side-panel.collapsed { transform: translateX(-240px); }

    .panel-header {
      padding: 22px 18px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-logo {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .panel-file {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .panel-section-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      padding: 14px 18px 6px;
      flex-shrink: 0;
    }

    #anim-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 16px;
    }
    #anim-list::-webkit-scrollbar { width: 3px; }
    #anim-list::-webkit-scrollbar-track { background: transparent; }
    #anim-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    .no-anims {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 8px;
      font-style: italic;
    }

    .anim-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 400;
      text-align: left;
      padding: 9px 10px;
      cursor: pointer;
      border-radius: 3px;
      margin-bottom: 3px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      letter-spacing: 0.2px;
    }
    .anim-btn:hover {
      background: var(--btn-hover);
      border-color: var(--border);
    }
    .anim-btn.active {
      background: var(--active-bg);
      border-color: var(--active-border);
      color: var(--accent);
    }
    .anim-btn .idx {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      min-width: 18px;
      flex-shrink: 0;
    }
    .anim-btn.active .idx { color: var(--accent2); }
    .anim-btn .play-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      opacity: 0;
      box-shadow: 0 0 6px var(--accent);
    }
    .anim-btn.active .play-dot { opacity: 1; }

    /* panel stats */
    .panel-stats {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .stat-row {
      display: flex; justify-content: space-between;
      font-size: 11px;
    }
    .stat-label { color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .stat-val { color: var(--text); font-family: var(--mono); font-size: 10px; }

    /* ── Toggle button ────────────────────────────────── */
    #toggle-panel {
      position: fixed;
      top: 18px; left: 250px;
      width: 28px; height: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 25;
      transition: left 0.3s ease, background 0.2s;
      backdrop-filter: blur(10px);
    }
    #toggle-panel:hover { background: var(--btn-hover); }
    #toggle-panel.collapsed { left: 10px; }

    /* ── Top-right HUD ────────────────────────────────── */
    #hud {
      position: fixed;
      top: 14px; right: 14px;
      display: flex; gap: 8px;
      z-index: 20;
    }
    .hud-btn {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 6px 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: color 0.2s, border-color 0.2s;
    }
    .hud-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Now-playing bar ──────────────────────────────── */
    #now-playing {
      position: fixed;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      padding: 10px 22px;
      display: flex; align-items: center; gap: 14px;
      z-index: 20;
      min-width: 280px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #now-playing.visible { opacity: 1; }
    .np-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: np-pulse 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes np-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .np-label {
      font-family: var(--mono);
      font-size: 9px; letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .np-name {
      font-size: 13px; font-weight: 600;
      color: var(--accent);
      font-family: var(--mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 220px;
    }

    /* ── Progress bar ─────────────────────────────────── */
    #progress-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: transparent;
      z-index: 30;
      display: none;
    }
    #progress-bar.visible { display: block; }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 0.08s linear;
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── Loading spinner ──────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #loading.visible { opacity: 1; }
    .spinner {
      width: 40px; height: 40px;
      border: 1px solid var(--border);
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      border-radius: 50%;
      animation: spin-ring 0.8s linear infinite;
    }
    .loading-text {
      font-family: var(--mono);
      font-size: 11px; letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    /* ── Grid overlay (subtle bg texture) ─────────────── */
    #canvas-container::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(56,217,245,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,217,245,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
    }

    /* corner decorations */
    .corner {
      position: fixed;
      width: 20px; height: 20px;
      z-index: 5;
      pointer-events: none;
    }
    .corner-tl { top: 6px; left: 6px;
      border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
    .corner-tr { top: 6px; right: 6px;
      border-top: 1px solid var(--accent); border-right: 1px solid var(--accent); }
    .corner-bl { bottom: 6px; left: 6px;
      border-bottom: 1px solid var(--accent); border-left: 1px solid var(--accent); }
    .corner-br { bottom: 6px; right: 6px;
      border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent); }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- corner decorations -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- drop/open overlay -->
  <div id="drop-overlay">
    <div class="drop-ring"><div class="drop-icon">⬡</div></div>
    <div class="drop-title">GLB Animation Viewer</div>
    <div class="drop-sub">Drop a .glb file here or click to browse</div>
    <button id="file-input-btn">Open file</button>
    <input type="file" id="file-hidden" accept=".glb" />
  </div>

  <!-- loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading model…</div>
  </div>

  <!-- side panel -->
  <div id="side-panel">
    <div class="panel-header">
      <div class="panel-logo">Anim Viewer</div>
      <div class="panel-file" id="panel-filename">No file loaded</div>
    </div>
    <div class="panel-section-label">Animations</div>
    <div id="anim-list"><div class="no-anims">Load a .glb to begin</div></div>
    <div class="panel-stats" id="panel-stats" style="display:none">
      <div class="stat-row">
        <span class="stat-label">Clips</span>
        <span class="stat-val" id="stat-clips">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Duration</span>
        <span class="stat-val" id="stat-dur">—</span>
      </div>
    </div>
  </div>

  <!-- toggle panel button -->
  <button id="toggle-panel">‹</button>

  <!-- top-right HUD -->
  <div id="hud">
    <button class="hud-btn" id="reset-cam-btn">Reset cam</button>
    <button class="hud-btn" id="load-new-btn">Load new</button>
  </div>

  <!-- now playing bar -->
  <div id="now-playing">
    <div class="np-dot"></div>
    <div>
      <div class="np-label">Now playing</div>
      <div class="np-name" id="np-name"></div>
    </div>
  </div>

  <!-- progress bar -->
  <div id="progress-bar"><div id="progress-fill"></div></div>

  <input type="file" id="load-new-input" accept=".glb" style="display:none" />

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── State ────────────────────────────────────────────────────────────
    let scene, camera, renderer, controls, clock;
    let mixer = null;
    let clips = {};          // name → AnimationClip
    let activeAction = null;
    let currentModel = null;
    let defaultCamPos = new THREE.Vector3();
    let animFrameId;

    // ── Init Three.js scene ──────────────────────────────────────────────
    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);
      scene.fog = new THREE.FogExp2(0x0a0a0f, 0.04);

      clock = new THREE.Clock();

      // camera
      camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
      camera.position.set(0, 1.4, 3.5);

      // renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      // lights
      const ambient = new THREE.AmbientLight(0xffffff, 1.8);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0xffffff, 3.5);
      dirLight.position.set(3, 8, 5);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.set(2048, 2048);
      dirLight.shadow.camera.near = 0.1;
      dirLight.shadow.camera.far = 40;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xd0eeff, 1.8);
      fillLight.position.set(-4, 2, -3);
      scene.add(fillLight);

      // back-rim light to separate model from background
      const rimLight = new THREE.DirectionalLight(0xffeedd, 1.2);
      rimLight.position.set(0, 4, -6);
      scene.add(rimLight);

      // low-angle front fill to reduce under-chin darkness
      const bottomFill = new THREE.DirectionalLight(0xffffff, 0.8);
      bottomFill.position.set(0, -3, 4);
      scene.add(bottomFill);

      // grid floor
      const gridHelper = new THREE.GridHelper(20, 40, 0x1a2530, 0x111820);
      gridHelper.position.y = -0.001;
      scene.add(gridHelper);

      // controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 0.5;
      controls.maxDistance = 20;
      controls.target.set(0, 1, 0);

      window.addEventListener('resize', onResize);
      render();
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    // ── Render loop ──────────────────────────────────────────────────────
    function render() {
      animFrameId = requestAnimationFrame(render);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      controls.update();
      renderer.render(scene, camera);
      updateProgressBar();
    }

    // ── Load GLB ─────────────────────────────────────────────────────────
    function loadGLB(file) {
      const url = URL.createObjectURL(file);
      const loadingEl = document.getElementById('loading');
      loadingEl.classList.add('visible');

      // remove old model
      if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
      }
      if (mixer) { mixer.stopAllAction(); mixer = null; }
      activeAction = null;
      clips = {};

      const loader = new GLTFLoader();
      loader.load(url, (gltf) => {
        URL.revokeObjectURL(url);
        loadingEl.classList.remove('visible');

        const model = gltf.scene;
        currentModel = model;

        // center & scale
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.0 / maxDim;
        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));

        // re-measure after scale
        const box2 = new THREE.Box3().setFromObject(model);
        const center2 = box2.getCenter(new THREE.Vector3());
        model.position.y -= box2.min.y; // place feet exactly on y=0 ground plane

        model.traverse(n => {
          if (n.isMesh) {
            n.castShadow = true;
            n.receiveShadow = true;
          }
        });

        scene.add(model);

        // camera default
        const dist = 2.2 / Math.tan((camera.fov * Math.PI / 180) / 2);
        // re-measure bounding box after foot correction to get accurate mid-body height
        const box3 = new THREE.Box3().setFromObject(model);
        const midY = (box3.min.y + box3.max.y) / 2;
        defaultCamPos.set(0, midY + 0.3, dist);
        camera.position.copy(defaultCamPos);
        controls.target.set(0, midY, 0);
        controls.update();

        // animations
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach(clip => { clips[clip.name] = clip; });

        buildUI(file.name, gltf.animations);
        hideDropOverlay();
      }, undefined, (err) => {
        console.error('GLB load error:', err);
        loadingEl.classList.remove('visible');
        alert('Failed to load GLB: ' + err.message);
      });
    }

    // ── Animation control ─────────────────────────────────────────────────
    const FADE_DURATION = 0.35;

    function playAnimation(name) {
      if (!mixer || !clips[name]) return;

      const clip = clips[name];
      const nextAction = mixer.clipAction(clip);

      if (activeAction === nextAction) {
        // toggle: restart
        activeAction.reset().play();
        return;
      }

      if (activeAction) {
        activeAction.fadeOut(FADE_DURATION);
      }

      nextAction
        .reset()
        .setEffectiveTimeScale(1)
        .setEffectiveWeight(1)
        .fadeIn(FADE_DURATION)
        .play();

      activeAction = nextAction;

      // UI state
      document.querySelectorAll('.anim-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.name === name);
      });

      // now-playing bar
      document.getElementById('np-name').textContent = name;
      document.getElementById('now-playing').classList.add('visible');

      // progress bar
      document.getElementById('stat-dur').textContent =
        clip.duration.toFixed(2) + 's';
      document.getElementById('progress-bar').classList.add('visible');
    }

    function updateProgressBar() {
      if (!activeAction || !activeAction.isRunning()) return;
      const clip = activeAction.getClip();
      const t = (activeAction.time % clip.duration) / clip.duration;
      document.getElementById('progress-fill').style.width = (t * 100) + '%';
    }

    // ── Build UI ─────────────────────────────────────────────────────────
    function buildUI(filename, animations) {
      document.getElementById('panel-filename').textContent = filename;

      const list = document.getElementById('anim-list');
      list.innerHTML = '';

      if (!animations.length) {
        list.innerHTML = '<div class="no-anims">No animations found.</div>';
        return;
      }

      animations.forEach((clip, i) => {
        const btn = document.createElement('button');
        btn.className = 'anim-btn';
        btn.dataset.name = clip.name;
        btn.innerHTML = `
          <span class="idx">${String(i).padStart(2,'0')}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${clip.name}</span>
          <span class="play-dot"></span>`;
        btn.addEventListener('click', () => playAnimation(clip.name));
        list.appendChild(btn);
      });

      const statsEl = document.getElementById('panel-stats');
      statsEl.style.display = 'flex';
      document.getElementById('stat-clips').textContent = animations.length;
    }

    function hideDropOverlay() {
      document.getElementById('drop-overlay').classList.add('hidden');
    }

    // ── Panel toggle ──────────────────────────────────────────────────────
    const toggleBtn = document.getElementById('toggle-panel');
    const sidePanel = document.getElementById('side-panel');
    let panelOpen = true;

    toggleBtn.addEventListener('click', () => {
      panelOpen = !panelOpen;
      sidePanel.classList.toggle('collapsed', !panelOpen);
      toggleBtn.classList.toggle('collapsed', !panelOpen);
      toggleBtn.textContent = panelOpen ? '‹' : '›';
    });

    // ── Reset camera ──────────────────────────────────────────────────────
    document.getElementById('reset-cam-btn').addEventListener('click', () => {
      camera.position.copy(defaultCamPos);
      controls.target.set(0, 1, 0);
      controls.update();
    });

    // ── File input handling ───────────────────────────────────────────────
    function handleFile(file) {
      if (file && file.name.endsWith('.glb')) loadGLB(file);
      else alert('Please select a .glb file.');
    }

    document.getElementById('file-input-btn').addEventListener('click', () => {
      document.getElementById('file-hidden').click();
    });
    document.getElementById('file-hidden').addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    document.getElementById('load-new-btn').addEventListener('click', () => {
      document.getElementById('load-new-input').click();
    });
    document.getElementById('load-new-input').addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    // drag & drop
    const body = document.body;
    body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-active'); });
    body.addEventListener('dragleave', () => body.classList.remove('drag-active'));
    body.addEventListener('drop', e => {
      e.preventDefault();
      body.classList.remove('drag-active');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    // ── Boot ──────────────────────────────────────────────────────────────
    initScene();
  </script>
</body>
</html>
